eureka:
    client:
        fetch-registry: true
        service-url:
            defaultZone: http://localhost:8761/eureka
            
spring:
    cloud:
        gateway:
            discovery:
                locator:
                    enabled: true
                routes:
                  - id: patients-service
                    url: lb://patients-service
                    predicates:
                    - Path=/addpatient/**
